# Upstream sources for the stage 1 toolchain: name, version, URL, SHA-256.
# Only official upstream release tarballs; no other distribution's packages.
#
# A sum of "-" means not yet pinned: fetch.sh downloads it, prints its sum
# and fails, so the sum can be checked against upstream's signature and
# filled in here. After that, any change to a tarball is caught.
binutils  2.45    https://ftp.gnu.org/gnu/binutils/binutils-2.45.tar.xz  -
gcc       15.2.0  https://ftp.gnu.org/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz  -
gmp       6.3.0   https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz  -
mpfr      4.2.2   https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz  -
mpc       1.3.1   https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz  -
glibc     2.42    https://ftp.gnu.org/gnu/glibc/glibc-2.42.tar.xz  -
linux     6.18    https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.tar.xz  -
