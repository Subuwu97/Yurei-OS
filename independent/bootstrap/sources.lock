# Upstream sources for the bootstrap: name, version, URL, SHA-256, and the
# step that first uses it (cross = stage1.sh, temp = temptools.sh). Only
# official upstream release tarballs; no other distribution's packages.
#
# A sum of "-" means not yet pinned: fetch.sh downloads it, prints its sum
# and fails, so the sum can be checked against upstream's signature and
# filled in here. After that, any change to a tarball is caught.
binutils  2.45    https://ftp.gnu.org/gnu/binutils/binutils-2.45.tar.xz  -  cross
gcc       15.2.0  https://ftp.gnu.org/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz  -  cross
