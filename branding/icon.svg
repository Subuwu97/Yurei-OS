<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Yūrei mark: a crescent moon that is also a little ghost -->
  <defs>
    <linearGradient id="moon" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f1e9ff"/>
      <stop offset="1" stop-color="#b49cf0"/>
    </linearGradient>
    <mask id="crescent">
      <!-- the moon's disc, with a ghost's wavy hem along its lower left -->
      <circle cx="60" cy="66" r="47" fill="#fff"/>
      <circle cx="20" cy="92" r="9" fill="#fff"/>
      <circle cx="33" cy="106" r="9" fill="#fff"/>
      <circle cx="13" cy="102" r="5" fill="#000"/>
      <circle cx="24" cy="114" r="5" fill="#000"/>
      <!-- the bite that makes it a crescent -->
      <circle cx="90" cy="44" r="33" fill="#000"/>
    </mask>
  </defs>
  <rect width="128" height="128" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- face in the moon's full part -->
  <circle cx="35" cy="66" r="4.4" fill="#2b2357"/>
  <circle cx="52" cy="73" r="4.4" fill="#2b2357"/>
  <path d="M 40 77 q 3.5 3.5 7.5 1.5" fill="none" stroke="#2b2357" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="28" cy="75" rx="4.5" ry="2.6" fill="#ff9ec7" opacity=".65"/>
  <ellipse cx="56" cy="83" rx="4.5" ry="2.6" fill="#ff9ec7" opacity=".65"/>
  <!-- sparkle inside the curve -->
  <path fill="#f1e9ff" d="M 100 30 l 2.8 7.2 l 7.2 2.8 l -7.2 2.8 l -2.8 7.2 l -2.8 -7.2 l -7.2 -2.8 l 7.2 -2.8 z"/>
</svg>
