name: CI

on:
  push:
  pull_request:

jobs:
  installer-gui:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install the Qt Widgets build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev fonts-noto-core
      - name: Build the independent installer GUI
        run: |
          cmake -S independent/packages/yurei-install-gui -B out/installer-gui -G Ninja -DBUILD_TESTING=ON
          cmake --build out/installer-gui --parallel 2
      - name: Test disk filtering, confirmation and password argument handling
        run: ctest --test-dir out/installer-gui --output-on-failure
      - name: Render preview screens (no disk access)
        run: |
          for page in 0 1 2 3 4 5 6; do
            out/installer-gui/yurei-install-gui --preview --page "$page" --screenshot "out/installer-$page.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-gui-previews
          path: out/installer-*.png
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck python3-pytest python3-yaml
      - run: make lint
      - run: make test

  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Plymouth, a virtual display and Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y plymouth plymouth-x11 plymouth-label plymouth-label-ft xvfb xdotool imagemagick \
            python3-pil python3-pytest python3-pip libegl1 libgl1 libxkbcommon0 fonts-noto-core
          pip install --break-system-packages PySide6-Essentials
      - name: SDDM theme in Qt 6
        run: python3 -m pytest -q tests/test_sddm_theme.py
      - name: Plasma splash and installer branding in Qt 6
        run: YUREI_SCREENSHOTS=theme-screenshots python3 -m pytest -q tests/test_branding_qml.py
      - name: Plymouth theme in the real daemon
        run: sudo python3 tests/plymouth_check.py --out theme-screenshots
      - name: Make test diagnostics readable by the artifact uploader
        if: always()
        run: |
          if [ -d theme-screenshots ]; then
            sudo find theme-screenshots -maxdepth 1 -type f -name '*.log' -exec chmod 0644 {} +
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-screenshots
          path: |
            theme-screenshots/*.png
            theme-screenshots/*.log

  package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build yurei packages with makepkg
        run: |
          pacman -Syu --noconfirm --needed base-devel git
          useradd -m builder
          chown -R builder .
          su builder -c 'make package'
      - uses: actions/upload-artifact@v4
        with:
          name: yurei-packages
          path: out/packages/*.pkg.tar.zst
