name: Build Yurei Plasma ISO (your PC)

on:
  workflow_dispatch:
  push:
    branches: [codex/desktop-integration]
    paths:
      - independent/**
      - themes/**
      - pkg/yurei-settings/files/**
      - .github/workflows/desktop-integration.yml

permissions:
  contents: read

concurrency:
  group: yurei-pc-iso-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Build and test Plasma ISO
    if: github.actor == 'Subuwu97'
    runs-on: yurei-pc
    timeout-minutes: 240
    env:
      YUREI: /home/runner/yurei-root
      SOURCES: /home/runner/yurei-sources
      YUREI_SIGNING_HOME: /home/runner/yurei-signing-gnupg
      BUILD_DESKTOP_ISO: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Require the previous build and complete local package cache
        run: |
          set -euo pipefail
          test "$(id -un)" = runner
          sudo -n true
          sudo install -d -m 0700 "$YUREI_SIGNING_HOME"
          test -w /dev/kvm
          sudo test -x "$YUREI/usr/bin/gcc"
          test -d "$SOURCES"
          test -f /home/runner/yurei-pkgcache/stamps/qt6-tools.hash
          test -f /home/runner/yurei-pkgcache/stamps/nvidia-utils.hash
          free -h
          df -h /home/runner /mnt/c
      - name: Verify sources and package recipes
        run: |
          independent/bootstrap/fetch.sh
          independent/packages/check-recipes.py
      - name: Reuse the existing system and rebuild only changed packages
        run: |
          set -euo pipefail
          # The previous run copied every completed package here before it
          # removed /srv/yurei. Never discard this local cache at startup.
          sudo rm -rf "$YUREI/srv/yurei"
          sudo mkdir -p "$YUREI/srv/yurei/previous/stamps"
          sudo cp -r independent/packages "$YUREI/srv/yurei/recipes"
          sudo python3 independent/packages/stage-appearance.py "$YUREI/srv/yurei/recipes/yurei-appearance/assets"
          sudo cp -r /home/runner/yurei-pkgcache/. "$YUREI/srv/yurei/previous/"
          # The failed repository check left its temporary build account.
          # Reset that account so setup can make a fresh throwaway signing key.
          if sudo chroot "$YUREI" /usr/bin/getent passwd yurei-builder >/dev/null; then
            sudo --preserve-env=YUREI,SOURCES,YUREI_SIGNING_HOME independent/bootstrap/chroot.sh repo-inside.sh cleanup
          fi
          sudo --preserve-env=YUREI,SOURCES,YUREI_SIGNING_HOME independent/bootstrap/chroot.sh repo-inside.sh
      - name: Stage the Yurei live system and boot files
        if: env.BUILD_DESKTOP_ISO == 'true'
        run: sudo --preserve-env=YUREI,SOURCES,YUREI_SIGNING_HOME independent/bootstrap/chroot.sh iso-inside.sh
      - name: Cache multimedia and gaming apps for the live image
        run: |
          set -euo pipefail
          available=$(df -B1 --output=avail /mnt/c | tail -n1 | tr -d ' ')
          if (( available < 60 * 1024 * 1024 * 1024 )); then
            echo "At least 60 GiB free on C: is required for app runtimes and ISO staging." >&2
            exit 1
          fi
          sudo mkdir -p /home/runner/yurei-flatpak
          sudo --preserve-env=SOURCES YUREI="$YUREI/srv/yurei/live" YUREI_APP_STORE=/home/runner/yurei-flatpak \
            independent/bootstrap/chroot.sh apps-inside.sh
      - name: Create the test ISO
        if: env.BUILD_DESKTOP_ISO == 'true'
        run: |
          # Hardlinks avoid duplicating multi-gigabyte runtimes on the build SSD.
          sudo mkdir -p "$YUREI/srv/yurei/live/var/lib/flatpak"
          sudo cp -al /home/runner/yurei-flatpak/. "$YUREI/srv/yurei/live/var/lib/flatpak/"
          sudo python3 -c 'import runpy,sys,pathlib; runpy.run_path("independent/packages/yurei-software/yurei-software.py", run_name="software")["set_media_defaults"](pathlib.Path(sys.argv[1]))' "$YUREI/srv/yurei/live"
          sudo YUREI="$YUREI" OUT=/home/runner/yurei-iso \
            ISO_NAME="yurei-independent-desktop-${GITHUB_RUN_ID}-x86_64.iso" independent/bootstrap/iso.sh
          sudo chown -R "$(id -u):$(id -g)" /home/runner/yurei-iso
      - name: Boot the ISO as DVD and USB, install and reboot a virtual disk
        if: env.BUILD_DESKTOP_ISO == 'true'
        run: |
          sudo EXPECTED_SESSION=sddm ISO="/home/runner/yurei-iso/yurei-independent-desktop-${GITHUB_RUN_ID}-x86_64.iso" \
            OUT=/home/runner/yurei-boot independent/bootstrap/iso-test.sh
      - name: Downloadable tested ISO and checksum
        if: env.BUILD_DESKTOP_ISO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yurei-desktop-integration-iso
          path: |
            /home/runner/yurei-iso/yurei-independent-desktop-${{ github.run_id }}-x86_64.iso
            /home/runner/yurei-iso/yurei-independent-desktop-${{ github.run_id }}-x86_64.iso.sha256
          compression-level: 0
          retention-days: 3
      - name: Preserve completed packages locally for the next attempt
        if: always()
        run: |
          if sudo test -d "$YUREI/srv/yurei/stamps"; then
            sudo cp "$YUREI"/srv/yurei/repo/*.pkg.tar.zst /home/runner/yurei-pkgcache/
            sudo cp -r "$YUREI/srv/yurei/stamps/." /home/runner/yurei-pkgcache/stamps/
            sudo chown -R "$(id -u):$(id -g)" /home/runner/yurei-pkgcache
          fi
      - name: Make boot diagnostics readable
        if: always()
        run: sudo chmod -R a+rX /home/runner/yurei-boot 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-integration-diagnostics
          path: |
            /home/runner/yurei-boot/*.log
            /home/runner/yurei-boot/*.json
            /home/runner/yurei-boot/*.png
            /home/runner/yurei-boot/*.wav
            /home/runner/yurei-root/srv/yurei/gui-previews/*.png
          if-no-files-found: ignore

  publish-repository:
    name: Publish tested independent package updates
    needs: recover
    if: github.actor == 'Subuwu97'
    runs-on: yurei-pc
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      YUREI_REPO: /home/runner/yurei-root/srv/yurei/repo
    steps:
      - uses: actions/checkout@v4
      - name: Install official Ubuntu release-publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh gnupg
      - name: Verify and publish the signed packages, then the database
        run: bash independent/bootstrap/publish-repository.sh
