name: Independent bootstrap

# docs/INDEPENDENT.md: builds Yūrei's toolchain from upstream source.
# Runs when the bootstrap changes, and on demand.
#
# The cross toolchain (stage1.sh, about an hour) is cached, keyed on the
# script and its sources, so changing a later step doesn't rebuild it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["independent/**", ".github/workflows/bootstrap.yml"]

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # outside the checkout, and without "..": the cache refuses such paths
      YUREI: /home/runner/yurei-root
      SOURCES: /home/runner/yurei-sources
    steps:
      - uses: actions/checkout@v4

      - name: Build tools from the host (only used to build, never shipped)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gawk texinfo m4 xz-utils python3 qemu-system-x86 e2fsprogs

      - name: Make room (the system, its archives and a disk image need about 20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/cache@v4
        with:
          path: ${{ env.SOURCES }}
          key: yurei-sources-${{ hashFiles('independent/bootstrap/sources.lock') }}
          restore-keys: yurei-sources-

      - name: Fetch and verify upstream sources
        run: |
          independent/bootstrap/fetch.sh
          independent/packages/check-recipes.py

      - name: Cache key for the cross toolchain
        id: cross
        run: |
          key=$( { cat independent/bootstrap/stage1.sh independent/bootstrap/lib.sh
                   awk '$5 == "cross"' independent/bootstrap/sources.lock; } | sha256sum | cut -c1-16)
          echo "key=yurei-cross-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: cross-cache
        with:
          path: ${{ env.YUREI }}
          key: ${{ steps.cross.outputs.key }}

      - name: Stage 1 - cross toolchain
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: |
          independent/bootstrap/stage1.sh
          rm -rf "$YUREI/build"

      - uses: actions/cache/save@v4
        if: steps.cross-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.YUREI }}
          key: ${{ steps.cross.outputs.key }}

      - name: Stage 1 check (also on a cached toolchain)
        if: steps.cross-cache.outputs.cache-hit == 'true'
        run: independent/bootstrap/stage1.sh check

      # The system after the chroot step is cached too (as an archive, since
      # its files belong to root), so work on the base system starts there.
      - name: Cache key for the chroot system
        id: chroot
        run: |
          key=$( { cd independent/bootstrap
                   cat stage1.sh lib.sh temptools.sh chroot.sh chroot-inside.sh inside-lib.sh
                   awk '$5 == "cross" || $5 == "temp" || $5 == "chroot"' sources.lock; } | sha256sum | cut -c1-16)
          echo "key=yurei-chroot-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: chroot-cache
        with:
          path: /home/runner/yurei-chroot.tar.zst
          key: ${{ steps.chroot.outputs.key }}

      - name: Unpack the cached chroot system
        if: steps.chroot-cache.outputs.cache-hit == 'true'
        run: |
          sudo rm -rf "$YUREI" && sudo mkdir -p "$YUREI"
          sudo tar --zstd -xpf /home/runner/yurei-chroot.tar.zst --numeric-owner -C "$YUREI"
          rm -f /home/runner/yurei-chroot.tar.zst

      - name: Temporary tools
        if: steps.chroot-cache.outputs.cache-hit != 'true'
        run: independent/bootstrap/temptools.sh

      - name: Chroot - Yūrei builds by itself
        if: steps.chroot-cache.outputs.cache-hit != 'true'
        run: |
          sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh
          sudo tar --zstd -cpf /home/runner/yurei-chroot.tar.zst --numeric-owner -C "$YUREI" .
          sudo chown "$(id -u):$(id -g)" /home/runner/yurei-chroot.tar.zst
          ls -lh /home/runner/yurei-chroot.tar.zst

      - uses: actions/cache/save@v4
        if: steps.chroot-cache.outputs.cache-hit != 'true'
        with:
          path: /home/runner/yurei-chroot.tar.zst
          key: ${{ steps.chroot.outputs.key }}

      # The system after part 1 of stage 2a is cached the same way.
      - name: Cache key for the base toolchain
        id: base
        run: |
          key=$( { echo "${{ steps.chroot.outputs.key }}"
                   cd independent/bootstrap
                   cat base-inside.sh
                   awk '$5 == "base"' sources.lock; } | sha256sum | cut -c1-16)
          echo "key=yurei-base-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: base-cache
        with:
          path: /home/runner/yurei-base.tar.zst
          key: ${{ steps.base.outputs.key }}

      - name: Unpack the cached base toolchain
        if: steps.base-cache.outputs.cache-hit == 'true'
        run: |
          sudo rm -rf "$YUREI" && sudo mkdir -p "$YUREI"
          sudo tar --zstd -xpf /home/runner/yurei-base.tar.zst --numeric-owner -C "$YUREI"
          rm -f /home/runner/yurei-base.tar.zst

      - name: Stage 2a, part 1 - final toolchain and core libraries
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh base-inside.sh
          sudo rm -rf "$YUREI/build"
          sudo tar --zstd -cpf /home/runner/yurei-base.tar.zst --numeric-owner -C "$YUREI" .
          sudo chown "$(id -u):$(id -g)" /home/runner/yurei-base.tar.zst
          ls -lh /home/runner/yurei-base.tar.zst

      - uses: actions/cache/save@v4
        if: steps.base-cache.outputs.cache-hit != 'true'
        with:
          path: /home/runner/yurei-base.tar.zst
          key: ${{ steps.base.outputs.key }}

      - name: Base toolchain check (also on a cached one)
        if: steps.base-cache.outputs.cache-hit == 'true'
        run: sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh base-inside.sh check

      # ... and after part 2.
      - name: Cache key for the core tools
        id: base2
        run: |
          key=$( { echo "${{ steps.base.outputs.key }}"
                   cd independent/bootstrap
                   cat base2-inside.sh
                   awk '$5 == "base2"' sources.lock; } | sha256sum | cut -c1-16)
          echo "key=yurei-base2-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: base2-cache
        with:
          path: /home/runner/yurei-base2.tar.zst
          key: ${{ steps.base2.outputs.key }}

      - name: Unpack the cached core tools
        if: steps.base2-cache.outputs.cache-hit == 'true'
        run: |
          sudo rm -rf "$YUREI" && sudo mkdir -p "$YUREI"
          sudo tar --zstd -xpf /home/runner/yurei-base2.tar.zst --numeric-owner -C "$YUREI"
          rm -f /home/runner/yurei-base2.tar.zst /home/runner/yurei-base.tar.zst /home/runner/yurei-chroot.tar.zst

      - name: Stage 2a, part 2 - core tools
        if: steps.base2-cache.outputs.cache-hit != 'true'
        run: |
          sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh base2-inside.sh
          sudo rm -rf "$YUREI/build"
          sudo tar --zstd -cpf /home/runner/yurei-base2.tar.zst --numeric-owner -C "$YUREI" .
          sudo chown "$(id -u):$(id -g)" /home/runner/yurei-base2.tar.zst
          ls -lh /home/runner/yurei-base2.tar.zst

      - uses: actions/cache/save@v4
        if: steps.base2-cache.outputs.cache-hit != 'true'
        with:
          path: /home/runner/yurei-base2.tar.zst
          key: ${{ steps.base2.outputs.key }}

      - name: Free the archive's space
        if: steps.base2-cache.outputs.cache-hit != 'true'
        run: rm -f /home/runner/yurei-base2.tar.zst /home/runner/yurei-base.tar.zst /home/runner/yurei-chroot.tar.zst

      # ... and after part 3.
      - name: Cache key for the bootable system
        id: base3
        run: |
          key=$( { echo "${{ steps.base2.outputs.key }}"
                   cd independent/bootstrap
                   cat base3-inside.sh
                   awk '$5 == "base3"' sources.lock; } | sha256sum | cut -c1-16)
          echo "key=yurei-base3-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: base3-cache
        with:
          path: /home/runner/yurei-base3.tar.zst
          key: ${{ steps.base3.outputs.key }}

      - name: Unpack the cached bootable system
        if: steps.base3-cache.outputs.cache-hit == 'true'
        run: |
          sudo rm -rf "$YUREI" && sudo mkdir -p "$YUREI"
          sudo tar --zstd -xpf /home/runner/yurei-base3.tar.zst --numeric-owner -C "$YUREI"
          rm -f /home/runner/yurei-*.tar.zst

      - name: Stage 2a, part 3 - systemd, D-Bus and Yūrei's kernel
        if: steps.base3-cache.outputs.cache-hit != 'true'
        run: |
          sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh base3-inside.sh
          sudo rm -rf "$YUREI/build"
          rm -f /home/runner/yurei-*.tar.zst
          sudo tar --zstd -cpf /home/runner/yurei-base3.tar.zst --numeric-owner -C "$YUREI" .
          sudo chown "$(id -u):$(id -g)" /home/runner/yurei-base3.tar.zst
          ls -lh /home/runner/yurei-base3.tar.zst

      - uses: actions/cache/save@v4
        if: steps.base3-cache.outputs.cache-hit != 'true'
        with:
          path: /home/runner/yurei-base3.tar.zst
          key: ${{ steps.base3.outputs.key }}

      - name: Stage 2b - pacman, signed packages from Yūrei's own repository
        run: |
          rm -f /home/runner/yurei-*.tar.zst
          sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh pacman-inside.sh
          sudo rm -rf "$YUREI/build"

      # The last run's packages: a recipe that hasn't changed isn't rebuilt.
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/yurei-pkgcache
          key: yurei-pkgs-${{ github.run_id }}
          restore-keys: yurei-pkgs-

      - name: Stage 2c - Yūrei's own packages and the [yurei] repository
        run: |
          sudo rm -rf "$YUREI/srv/yurei" && sudo mkdir -p "$YUREI/srv/yurei/previous/stamps"
          sudo cp -r independent/packages "$YUREI/srv/yurei/recipes"
          if [[ -d /home/runner/yurei-pkgcache ]]; then
            sudo cp -r /home/runner/yurei-pkgcache/. "$YUREI/srv/yurei/previous/"
          fi
          sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh repo-inside.sh
          sudo rm -rf "$YUREI/build"
          mkdir -p /home/runner/yurei-repo
          sudo cp "$YUREI"/srv/yurei/repo/* /home/runner/yurei-repo/
          sudo chown -R "$(id -u):$(id -g)" /home/runner/yurei-repo
          du -sh /home/runner/yurei-repo

      # This run's packages and recipe hashes, for the next run; also after
      # a failure, so the packages that did build aren't built again.
      - name: Keep the packages for the next run
        id: keep
        if: always()
        run: |
          rm -rf /home/runner/yurei-pkgcache && mkdir -p /home/runner/yurei-pkgcache
          if sudo test -d "$YUREI/srv/yurei/stamps"; then
            sudo sh -c 'cp "$1"/srv/yurei/repo/*.pkg.tar.zst "$2"/ 2>/dev/null; cp -r "$1"/srv/yurei/stamps "$2"/' \
              sh "$YUREI" /home/runner/yurei-pkgcache
            sudo chown -R "$(id -u):$(id -g)" /home/runner/yurei-pkgcache
            # only a cache with packages in it replaces the last good one
            compgen -G '/home/runner/yurei-pkgcache/stamps/*.hash' > /dev/null && echo "save=true" >> "$GITHUB_OUTPUT"
          fi
          ls /home/runner/yurei-pkgcache/stamps 2>/dev/null | sed -n 's/\.hash$//p' | tr '\n' ' '
          # the build's files aren't part of the system that's booted next
          sudo rm -rf "$YUREI/srv/yurei"

      - uses: actions/cache/save@v4
        if: always() && steps.keep.outputs.save == 'true'
        with:
          path: /home/runner/yurei-pkgcache
          key: yurei-pkgs-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: yurei-repo
          path: /home/runner/yurei-repo
          retention-days: 14

      - name: Boot Yūrei in QEMU
        run: |
          # GitHub's runners have KVM; it makes the boot take seconds, not minutes
          ls -l /dev/kvm || true
          sudo YUREI="$YUREI" OUT=/home/runner/yurei-boot independent/bootstrap/boot-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-log
          path: /home/runner/yurei-boot/serial.log
          if-no-files-found: ignore

      - name: Source checksums (to pin in sources.lock)
        if: always()
        run: cd "$SOURCES" && sha256sum -- * 2>/dev/null || true

      - name: Size of the result
        if: always()
        run: |
          sudo rm -rf "$YUREI/build"
          sudo du -sh "$YUREI"/tools "$YUREI"/usr 2>/dev/null || true
