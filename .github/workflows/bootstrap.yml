name: Independent bootstrap

# docs/INDEPENDENT.md: builds Yūrei's toolchain from upstream source.
# Runs when the bootstrap changes, and on demand.
#
# The cross toolchain (stage1.sh, about an hour) is cached, keyed on the
# script and its sources, so changing a later step doesn't rebuild it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["independent/**", ".github/workflows/bootstrap.yml"]

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # outside the checkout, and without "..": the cache refuses such paths
      YUREI: /home/runner/yurei-root
      SOURCES: /home/runner/yurei-sources
    steps:
      - uses: actions/checkout@v4

      - name: Build tools from the host (only used to build, never shipped)
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gawk texinfo m4 xz-utils python3

      - uses: actions/cache@v4
        with:
          path: ${{ env.SOURCES }}
          key: yurei-sources-${{ hashFiles('independent/bootstrap/sources.lock') }}
          restore-keys: yurei-sources-

      - name: Fetch and verify upstream sources
        run: independent/bootstrap/fetch.sh

      - name: Cache key for the cross toolchain
        id: cross
        run: |
          key=$( { cat independent/bootstrap/stage1.sh independent/bootstrap/lib.sh
                   awk '$5 == "cross"' independent/bootstrap/sources.lock; } | sha256sum | cut -c1-16)
          echo "key=yurei-cross-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: cross-cache
        with:
          path: ${{ env.YUREI }}
          key: ${{ steps.cross.outputs.key }}

      - name: Stage 1 - cross toolchain
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: |
          independent/bootstrap/stage1.sh
          rm -rf "$YUREI/build"

      - uses: actions/cache/save@v4
        if: steps.cross-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.YUREI }}
          key: ${{ steps.cross.outputs.key }}

      - name: Stage 1 check (also on a cached toolchain)
        if: steps.cross-cache.outputs.cache-hit == 'true'
        run: independent/bootstrap/stage1.sh check

      # The system after the chroot step is cached too (as an archive, since
      # its files belong to root), so work on the base system starts there.
      - name: Cache key for the chroot system
        id: chroot
        run: |
          key=$( { cd independent/bootstrap
                   cat stage1.sh lib.sh temptools.sh chroot.sh chroot-inside.sh inside-lib.sh
                   awk '$5 == "cross" || $5 == "temp" || $5 == "chroot"' sources.lock; } | sha256sum | cut -c1-16)
          echo "key=yurei-chroot-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: chroot-cache
        with:
          path: /home/runner/yurei-chroot.tar.zst
          key: ${{ steps.chroot.outputs.key }}

      - name: Unpack the cached chroot system
        if: steps.chroot-cache.outputs.cache-hit == 'true'
        run: |
          sudo rm -rf "$YUREI" && sudo mkdir -p "$YUREI"
          sudo tar --zstd -xpf /home/runner/yurei-chroot.tar.zst --numeric-owner -C "$YUREI"

      - name: Temporary tools
        if: steps.chroot-cache.outputs.cache-hit != 'true'
        run: independent/bootstrap/temptools.sh

      - name: Chroot - Yūrei builds by itself
        if: steps.chroot-cache.outputs.cache-hit != 'true'
        run: |
          sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh
          sudo tar --zstd -cpf /home/runner/yurei-chroot.tar.zst --numeric-owner -C "$YUREI" .
          sudo chown "$(id -u):$(id -g)" /home/runner/yurei-chroot.tar.zst
          ls -lh /home/runner/yurei-chroot.tar.zst

      - uses: actions/cache/save@v4
        if: steps.chroot-cache.outputs.cache-hit != 'true'
        with:
          path: /home/runner/yurei-chroot.tar.zst
          key: ${{ steps.chroot.outputs.key }}

      # The system after part 1 of stage 2a is cached the same way.
      - name: Cache key for the base toolchain
        id: base
        run: |
          key=$( { echo "${{ steps.chroot.outputs.key }}"
                   cd independent/bootstrap
                   cat base-inside.sh
                   awk '$5 == "base"' sources.lock; } | sha256sum | cut -c1-16)
          echo "key=yurei-base-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: base-cache
        with:
          path: /home/runner/yurei-base.tar.zst
          key: ${{ steps.base.outputs.key }}

      - name: Unpack the cached base toolchain
        if: steps.base-cache.outputs.cache-hit == 'true'
        run: |
          sudo rm -rf "$YUREI" && sudo mkdir -p "$YUREI"
          sudo tar --zstd -xpf /home/runner/yurei-base.tar.zst --numeric-owner -C "$YUREI"

      - name: Stage 2a, part 1 - final toolchain and core libraries
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: |
          sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh base-inside.sh
          sudo rm -rf "$YUREI/build"
          sudo tar --zstd -cpf /home/runner/yurei-base.tar.zst --numeric-owner -C "$YUREI" .
          sudo chown "$(id -u):$(id -g)" /home/runner/yurei-base.tar.zst
          ls -lh /home/runner/yurei-base.tar.zst

      - uses: actions/cache/save@v4
        if: steps.base-cache.outputs.cache-hit != 'true'
        with:
          path: /home/runner/yurei-base.tar.zst
          key: ${{ steps.base.outputs.key }}

      - name: Base toolchain check (also on a cached one)
        if: steps.base-cache.outputs.cache-hit == 'true'
        run: sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh base-inside.sh check

      - name: Stage 2a, part 2 - core tools
        run: sudo --preserve-env=YUREI,SOURCES independent/bootstrap/chroot.sh base2-inside.sh

      - name: Source checksums (to pin in sources.lock)
        if: always()
        run: cd "$SOURCES" && sha256sum -- * 2>/dev/null || true

      - name: Size of the result
        if: always()
        run: |
          sudo rm -rf "$YUREI/build"
          sudo du -sh "$YUREI"/tools "$YUREI"/usr 2>/dev/null || true
