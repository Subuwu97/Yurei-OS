name: Build ISO

# Builds the Yūrei ISO in CachyOS's own container image (CachyOS's
# repositories and keys come ready) and publishes it as a pre-release.
#
# GitHub caps release files at 2 GB and the ISO is bigger, so it's uploaded
# in parts; join them after downloading (see the release notes or README).
# Releases don't count against Actions storage, so this works for private
# repositories on the free plan too.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the build needs ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Build in a CachyOS container
        run: |
          sudo docker run --rm --privileged -v "$PWD":/src -w /src cachyos/cachyos:latest bash -euxc '
            pacman -Syu --noconfirm --needed archiso mkinitcpio-archiso git squashfs-tools grub base-devel sudo perl
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            chown -R builder /src
            su builder -c "./build.sh"
          '
          ls -la out/

      - name: Take back the checkout
        # the container's build user owns it now, even if the build failed
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Split into parts under 2 GB, with join scripts
        run: |
          cd out
          iso=$(ls yurei-*-x86_64.iso)
          split --bytes=1900M --numeric-suffixes=1 --suffix-length=2 "$iso" "$iso.part"
          parts=$(ls "$iso".part* | xargs)
          # Windows: double-click to join and check (Command Prompt's copy /b;
          # PowerShell's own "copy" can't join files)
          {
            echo '@echo off'
            echo 'rem Joins the downloaded parts into the Yurei ISO and checks it.'
            echo 'cd /d "%~dp0"'
            for part in $parts; do
              echo "if not exist \"$part\" (echo Missing $part - download it into this folder first. & pause & exit /b 1)"
            done
            echo "echo Joining the parts into $iso, this takes a minute..."
            echo "copy /b $(echo "$parts" | sed 's/ / + /g') \"$iso\" >nul || (echo Joining failed. & pause & exit /b 1)"
            echo 'echo Checking it...'
            echo "powershell -NoProfile -Command \"\$want = (Get-Content '$iso.sha256').Split(' ')[0]; \$got = (Get-FileHash '$iso' -Algorithm SHA256).Hash; if (\$got -ieq \$want) { Write-Host 'OK: $iso is complete.' } else { Write-Host 'The ISO does not match: download the parts again.'; exit 1 }\""
            echo 'pause'
          } | sed 's/$/\r/' > join-windows.bat
          printf '#!/bin/sh\n# Joins the downloaded parts into the Yurei ISO and checks it.\ncd "$(dirname "$0")" && cat %s > %s && sha256sum -c %s.sha256\n' \
              "$parts" "$iso" "$iso" > join-linux-mac.sh
          cat join-windows.bat join-linux-mac.sh
          ls -la
          echo "ISO=$iso" >> "$GITHUB_ENV"
          echo "PARTS=$parts" >> "$GITHUB_ENV"

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck source=/dev/null
          source release.conf
          tag="iso-${RELEASE_VERSION}-$(date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          **Yūrei ${RELEASE_VERSION} "${RELEASE_CODENAME}"**, test build from ${GITHUB_SHA::7}, $(date +%Y-%m-%d).
          Not yet tested on real hardware.

          The ISO is split into parts because GitHub limits files to 2 GB. Download **every
          \`.part\` file, the \`.sha256\` file and the join script for your system** into one folder:

          - **Windows:** double-click \`join-windows.bat\`. It joins the parts and checks the result.
            (If Windows says it protected your PC, choose *More info* → *Run anyway*.)
            By hand, in **Command Prompt** (not PowerShell):
            \`copy /b $(echo "$PARTS" | sed 's/ / + /g') ${ISO}\`
          - **Linux / macOS:** \`sh join-linux-mac.sh\`, or \`cat ${ISO}.part* > ${ISO} && sha256sum -c ${ISO}.sha256\`

          Write the joined ISO to a USB stick with Ventoy, balenaEtcher or Rufus (DD mode), or boot it in a VM.
          EOF
          cd out
          # shellcheck disable=SC2086 # PARTS is a list of names
          gh release create "$tag" --prerelease \
              --title "Yūrei ${RELEASE_VERSION} ${RELEASE_CODENAME} (test build $(date +%Y-%m-%d))" \
              --notes-file ../notes.md $PARTS "$ISO.sha256" join-windows.bat join-linux-mac.sh
