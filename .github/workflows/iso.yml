name: Build ISO

# The ISO is large and slow to build, so this only runs on demand and for
# tagged releases. It uses CachyOS's own container image so the CachyOS
# repositories and keys are already set up.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed archiso mkinitcpio-archiso git squashfs-tools grub base-devel sudo perl
      - name: Build
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder .
          su builder -c './build.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: yurei-iso
          path: out/yurei-*
