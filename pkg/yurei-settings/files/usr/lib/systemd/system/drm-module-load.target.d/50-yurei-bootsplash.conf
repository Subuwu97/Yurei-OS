# CachyOS's GPU driver check (cachyos-drm-awaiter) generates this target. It
# waits for the boot animation to finish (After=plymouth-quit.service) but
# gives up 30 s after it was queued, early in boot. With the animation on, a
# live USB stick or a slow disk can take longer than that to get there, and
# the check then reports a GPU driver failure that isn't one ("The current
# boot has failed! Failed to load your GPU driver(s)."). Give it more time;
# a real driver failure is still reported, just later.
[Unit]
JobTimeoutSec=120s
