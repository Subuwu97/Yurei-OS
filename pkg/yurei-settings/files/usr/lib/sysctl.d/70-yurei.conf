# Yūrei gaming defaults. CachyOS's own tuning (cachyos-settings) is loaded
# later and wins wherever both set the same key.

# Some games (e.g. DayZ, Hogwarts Legacy, CS2 workshop maps) need a very
# large number of memory mappings; this matches SteamOS.
vm.max_map_count = 2147483642

# Don't throttle programs that perform split locks; the throttling causes
# stutter in a number of games.
kernel.split_lock_mitigate = 0
