# The installer page where each person picks extras: Flathub apps, and
# Linux environments for software made for another distribution (each a
# Distrobox container with its own package manager: apt, dnf or pacman).
#
# The choice is passed to yurei-install-target (shellprocess_yurei.conf) as
# a comma-separated list of the ids below. The environments are created at
# the first login, since they're downloaded and belong to the user.
---
mode: optionalmultiple
method: legacy
labels:
    step: "Apps"
items:
    - id: flatpak
      name: "Flatpak apps from Flathub"
      description: "Thousands of desktop apps (Discord, OBS, browsers, launchers) from one store, kept up to date by Discover and \"yurei update\". Recommended."
      screenshot: "/usr/share/calamares/branding/yurei/extras-flatpak.png"
      selected: true
    - id: ubuntu
      name: "Ubuntu environment (apt)"
      description: "An Ubuntu system in a container, with apt-get. Install software made for Ubuntu or Debian; its apps appear in your app menu. Yūrei itself stays untouched. Downloaded at your first login (about 30 MB, more as you add software)."
      screenshot: "/usr/share/calamares/branding/yurei/extras-ubuntu.png"
    - id: fedora
      name: "Fedora environment (dnf / RPM)"
      description: "A Fedora system in a container, with dnf and RPM packages. Install software made for Fedora or Red Hat; its apps appear in your app menu. Yūrei itself stays untouched. Downloaded at your first login (about 60 MB, more as you add software)."
      screenshot: "/usr/share/calamares/branding/yurei/extras-fedora.png"
    - id: arch
      name: "Arch environment (pacman)"
      description: "A separate Arch Linux system in a container, for trying packages without touching Yūrei itself. Yūrei already uses pacman, so most people won't need this. Downloaded at your first login (about 150 MB)."
      screenshot: "/usr/share/calamares/branding/yurei/extras-arch.png"
