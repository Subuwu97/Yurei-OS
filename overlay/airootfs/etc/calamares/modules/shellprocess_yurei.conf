# Runs after CachyOS's installer has set up the new system: installs the
# Yūrei packages and gaming stack into it, plus the extras picked on the
# Apps page (a comma-separated list; empty or unexpanded without the page).
---
dontChroot: true
timeout: 3600
script:
    - "/usr/local/bin/yurei-install-target ${ROOT} '${gs[packagechooser_yureiextras]}'"
